# ================================================================
# Gateway 网关服务配置
# 职责：统一入口、JWT 鉴权、路由转发、跨域处理
# 端口 10000，所有客户端请求统一走网关，不再直连业务服务

spring:
  application:
    name: gateway-service
  cloud:
    # ---------- Nacos 服务注册 & 配置中心 ----------
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml           # 配置文件格式（yaml / properties）
  profiles:
    active: dev # 环境标识

